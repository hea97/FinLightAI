<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FinLightAI Login</title>
    <link rel="stylesheet" href="/static/css/styles.css" />
  </head>
  <body class="login-body">
    <main class="login-shell">
      <section class="login-visual">
        <a class="brand login-brand" href="/">
          <span class="brand-mark">FL</span>
          <span>
            <strong>FinLightAI</strong>
            <small>Signal Intelligence</small>
          </span>
        </a>
        <div class="login-copy">
          <p class="eyebrow">AI 금융 리스크 관리</p>
          <h1>흩어지는 시장 신호를 한 계정에서 이어가세요.</h1>
          <p>Google 계정으로 관심 종목, 저장 뉴스, 포트폴리오를 연결해 개인화된 금융 신호를 확인할 수 있습니다.</p>
        </div>
        <div class="login-metrics" aria-label="서비스 상태">
          <span><strong>0.88</strong> 평균 신뢰도</span>
          <span><strong>24/7</strong> 뉴스 모니터링</span>
          <span><strong>3단계</strong> RED/YELLOW/GREEN</span>
        </div>
      </section>

      <section class="login-card" aria-label="로그인">
        <div>
          <p class="eyebrow">Welcome Back</p>
          <h2>FinLightAI 로그인</h2>
          <p>현재는 화면 디자인 단계입니다. 실제 OAuth 연동 전까지 Google 로그인 버튼 UI만 제공합니다.</p>
        </div>

        <button class="google-btn" type="button">
          <span aria-hidden="true">G</span>
          Google로 계속하기
        </button>

        <a class="subtle-link" href="/">대시보드로 돌아가기</a>
      </section>
    </main>
  </body>
</html>
