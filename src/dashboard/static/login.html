<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FinLightAI 로그인</title>
    <link rel="stylesheet" href="/static/css/styles.css?v=20260622-final-ko" />
  </head>
  <body class="login-body">
    <main class="login-shell">
      <section class="login-visual">
        <a class="brand-row login-brand" href="/">
          <span class="brand-mark">FL</span>
          <span>
            <strong class="brand-name">FinLightAI</strong>
            <small class="brand-sub">AI 금융 상황판</small>
          </span>
        </a>
        <div class="login-copy">
          <p class="eyebrow">인증 흐름</p>
          <h1>시장 신호와 뉴스 근거를 개인 계정으로 이어갑니다.</h1>
          <p>로그인은 사이드 메뉴가 아니라 인증 흐름으로 분리합니다. 계정 연결 후 관심 자산, 알림 조건, 카카오 채널 봇 알림을 개인화할 수 있습니다.</p>
        </div>
        <div class="login-metrics" aria-label="서비스 상태">
          <span><strong>영향도</strong> 뉴스가 시장에 줄 가능성</span>
          <span><strong>신뢰도</strong> 뉴스를 조심해서 볼 정도</span>
          <span><strong>알림</strong> 조건 충족 시 카카오 발송</span>
        </div>
      </section>

      <section class="login-card" aria-label="로그인">
        <div>
          <p class="eyebrow">Welcome Back</p>
          <h2>FinLightAI 로그인</h2>
          <p>현재는 MVP 프로토타입 단계입니다. 실제 OAuth 연동 전까지 Google 로그인 버튼 UI만 제공합니다.</p>
        </div>
        <button class="google-btn" type="button"><span aria-hidden="true">G</span>Google로 계속하기</button>
        <a class="subtle-link" href="/">개요로 돌아가기</a>
      </section>
    </main>
  </body>
</html>
