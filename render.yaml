services:
  - type: web
    name: finlightai-api
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python scripts/setup_db.py
    startCommand: uvicorn src.dashboard.app:app --host 0.0.0.0 --port $PORT
    initialDeployHook: python scripts/refresh_pipeline_data.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: finlightai-postgres
          property: connectionString
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_EXPIRE_MINUTES
        value: 1440
      - key: AUTH_COOKIE_SAMESITE
        value: none
      - key: AUTH_COOKIE_SECURE
        value: true
      - key: GDELT_BASE_URL
        value: https://api.gdeltproject.org/api/v2/doc/doc
      - key: EXTERNAL_API_TIMEOUT_SECONDS
        value: 10
      - key: EXTERNAL_API_CACHE_SECONDS
        value: 300
      - key: GEMINI_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false

  # Render cron jobs require a paid instance. Confirm the selected plan before
  # applying this Blueprint in a billing-enabled workspace.
  - type: cron
    name: finlightai-data-refresh
    runtime: python
    plan: starter
    region: singapore
    branch: main
    schedule: "0 */6 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/refresh_pipeline_data.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: finlightai-postgres
          property: connectionString
      - key: GDELT_BASE_URL
        value: https://api.gdeltproject.org/api/v2/doc/doc
      - key: EXTERNAL_API_TIMEOUT_SECONDS
        value: 10
      - key: EXTERNAL_API_CACHE_SECONDS
        value: 300
      - key: GEMINI_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false

databases:
  - name: finlightai-postgres
    databaseName: finlightai
    user: finlightai
    plan: free
    region: singapore
    ipAllowList: []
